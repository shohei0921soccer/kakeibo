<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="default"
>

<title>家計簿</title>

<style>

*{
  box-sizing:border-box;
}

:root{
  --bg:#f5f5f7;
  --card:#ffffff;
  --text:#222222;
  --sub:#777777;
  --border:#e7e7e7;
  --danger:#e5484d;
}

html,
body{
  width:100%;
  overflow-x:hidden;
}

body{
  margin:0;

  background:var(--bg);
  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    sans-serif;
}

button,
input,
textarea,
select{
  font-family:inherit;
}

.app{
  width:100%;
  max-width:650px;

  margin:0 auto;

  padding:
    18px
    14px
    120px;
}

h1{
  margin:8px 0 4px;
  font-size:30px;
}

h2{
  margin:0 0 14px;
  font-size:20px;
}

h3{
  margin:0 0 8px;
  font-size:16px;
}

.card{
  width:100%;

  margin-bottom:16px;
  padding:18px;

  background:#fff;

  border-radius:18px;

  box-shadow:
    0 2px 10px
    rgba(0,0,0,.05);
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.subtext{
  color:var(--sub);

  font-size:13px;
  line-height:1.6;
}

.empty{
  padding:22px 0;

  text-align:center;

  color:#888;
}



/* =========================
   月切り替え
========================= */

.month-nav{
  display:flex;
  align-items:center;

  gap:8px;

  margin:14px 0 18px;
}

.month-nav button{
  flex:0 0 48px;

  width:48px;
  height:44px;

  margin:0;
  padding:0;

  background:#fff;
  color:#222;

  border:
    1px solid
    var(--border);

  border-radius:12px;

  font-size:22px;
}

.month-label{
  flex:1;

  text-align:center;

  font-size:18px;
  font-weight:700;
}



/* =========================
   フォーム
========================= */

.field{
  width:100%;
  min-width:0;

  margin-top:14px;
}

label{
  display:block;

  margin-bottom:6px;

  color:#555;

  font-size:14px;
}

input,
textarea,
select{
  display:block;

  width:100%!important;
  min-width:0!important;
  max-width:100%!important;

  margin:0;

  padding:
    13px
    12px;

  border:
    1px solid
    #ddd;

  border-radius:12px;

  background:#fff;

  color:#222;

  font-size:16px;
}

input[type="date"]{
  width:100%!important;
  min-width:0!important;
  max-width:100%!important;

  -webkit-appearance:none;
  appearance:none;
}

textarea{
  min-height:170px;

  resize:vertical;
}

button{
  width:100%;

  margin-top:14px;

  padding:14px;

  border:none;
  border-radius:14px;

  background:#111;
  color:#fff;

  font-size:16px;
  font-weight:700;
}

button.secondary{
  background:#fff;
  color:#111;

  border:
    1px solid
    #ccc;
}

button.danger{
  background:var(--danger);
}

button.small{
  width:auto;

  margin:0;

  padding:
    8px
    10px;

  font-size:12px;
}



/* =========================
   ホーム
========================= */

.total-label{
  color:var(--sub);

  font-size:14px;
}

.total{
  margin-top:4px;

  font-size:38px;
  font-weight:700;
}

.category-row{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:12px;

  padding:12px 0;

  border-bottom:
    1px solid
    #eee;
}

.category-row:last-child{
  border-bottom:none;
}

.category-amount{
  white-space:nowrap;

  font-weight:700;
}



/* =========================
   予算
========================= */

.budget-top{
  display:flex;

  justify-content:space-between;
  align-items:flex-end;

  gap:10px;
}

.budget-main{
  margin-top:4px;

  font-size:27px;
  font-weight:700;
}

.budget-progress{
  width:100%;
  height:12px;

  margin-top:13px;

  overflow:hidden;

  background:#eee;

  border-radius:999px;
}

.budget-progress-bar{
  width:0;
  height:100%;

  background:#222;

  border-radius:999px;
}

.budget-over
.budget-progress-bar{
  background:#e5484d;
}



/* =========================
   円グラフ
========================= */

.pie-area{
  display:flex;
  flex-direction:column;
  align-items:center;

  gap:18px;
}

.pie-toggle{
  display:flex;

  width:100%;

  gap:5px;

  padding:4px;

  background:#f1f1f1;

  border-radius:13px;
}

.pie-toggle button{
  flex:1;

  width:auto;

  margin:0;

  padding:
    10px
    5px;

  border-radius:10px;

  background:transparent;
  color:#777;

  font-size:14px;
  font-weight:700;
}

.pie-toggle button.active{
  background:#fff;
  color:#111;

  box-shadow:
    0 1px 5px
    rgba(0,0,0,.09);
}

.pie-chart{
  position:relative;

  width:220px;
  height:220px;

  max-width:75vw;
  max-height:75vw;

  border-radius:50%;

  background:#eee;
}

.pie-hole{
  position:absolute;

  inset:22%;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:10px;

  background:#fff;

  border-radius:50%;

  text-align:center;

  font-size:14px;
  font-weight:700;
}

.pie-legend{
  width:100%;
}

.legend-row{
  display:flex;

  align-items:center;
  justify-content:space-between;

  gap:10px;

  padding:7px 0;
}

.legend-left{
  display:flex;
  align-items:center;

  gap:8px;

  min-width:0;
}

.legend-dot{
  width:12px;
  height:12px;

  flex:0 0 auto;

  border-radius:50%;
}

.legend-value{
  white-space:nowrap;

  font-size:14px;
  font-weight:600;
}



/* =========================
   カレンダー
========================= */

.calendar{
  overflow:hidden;

  border:
    1px solid
    var(--border);

  border-radius:14px;
}

.calendar-week,
.calendar-grid{
  display:grid;

  grid-template-columns:
    repeat(
      7,
      minmax(0,1fr)
    );
}

.calendar-week{
  background:#f6f6f6;

  border-bottom:
    1px solid
    var(--border);
}

.calendar-week div{
  padding:
    9px
    2px;

  text-align:center;

  color:var(--sub);

  font-size:12px;
  font-weight:600;
}

.calendar-day{
  min-width:0;
  min-height:68px;

  padding:
    7px
    3px;

  overflow:hidden;

  background:#fff;

  border-right:
    1px solid
    #eee;

  border-bottom:
    1px solid
    #eee;

  cursor:pointer;
}

.calendar-day:nth-child(7n){
  border-right:none;
}

.calendar-day.empty-day{
  background:#fafafa;

  cursor:default;
}

.calendar-date{
  font-size:13px;
  font-weight:600;
}

.calendar-money{
  margin-top:6px;

  overflow-wrap:anywhere;

  font-size:9px;
  font-weight:700;
}

.calendar-day.has-spending{
  background:#fafafa;
}

.calendar-day.selected-day{
  outline:
    2px solid
    #222;

  outline-offset:-2px;
}

.day-detail{
  margin-top:16px;
}

.day-detail-title{
  margin-bottom:10px;

  font-size:17px;
  font-weight:700;
}



/* =========================
   ChatGPT一括入力
========================= */

.hint{
  margin-bottom:10px;

  color:var(--sub);

  font-size:13px;
  line-height:1.6;
}

.preview{
  display:none;

  margin-top:18px;
}

.preview-item{
  display:flex;

  justify-content:space-between;

  gap:8px;

  padding:7px 0;
}

.preview-item-left{
  flex:1;

  min-width:0;
}

.badge{
  display:inline-block;

  margin-left:5px;

  padding:
    2px
    7px;

  background:#eee;

  border-radius:999px;

  font-size:11px;
}

.new-badge{
  background:#222;
  color:#fff;
}

.success{
  display:none;

  margin-top:12px;

  padding:11px;

  background:#f0f0f0;

  border-radius:10px;
}



/* =========================
   詳細
========================= */

.receipt-card{
  margin-bottom:14px;

  overflow:hidden;

  background:#fff;

  border-radius:18px;

  box-shadow:
    0 2px 10px
    rgba(0,0,0,.05);
}

.receipt-header{
  padding:16px;

  cursor:pointer;
}

.receipt-top{
  display:flex;

  justify-content:space-between;

  gap:10px;
}

.receipt-date{
  color:var(--sub);

  font-size:13px;
}

.receipt-shop{
  margin-top:3px;

  font-size:17px;
  font-weight:700;
}

.receipt-total{
  white-space:nowrap;

  font-size:18px;
  font-weight:700;
}

.receipt-count{
  margin-top:7px;

  color:var(--sub);

  font-size:13px;
}

.receipt-body{
  display:none;

  padding:
    0
    16px
    16px;
}

.receipt-body.open{
  display:block;
}

.detail-category-title{
  margin:
    14px
    0
    5px;

  font-size:14px;
  font-weight:700;
}

.detail-item{
  display:flex;

  align-items:center;

  gap:7px;

  padding:10px 0;

  border-bottom:
    1px solid
    #eee;
}

.detail-item-name{
  flex:1;

  min-width:0;
}

.detail-item-price{
  white-space:nowrap;

  font-weight:600;
}

.fixed-tag{
  display:inline-block;

  margin-left:4px;

  padding:
    2px
    6px;

  background:#eee;

  border-radius:999px;

  color:#555;

  font-size:10px;
}



/* =========================
   検索
========================= */

.search-result{
  padding:12px 0;

  border-bottom:
    1px solid
    #eee;
}

.search-result:last-child{
  border-bottom:none;
}

.search-result-top{
  display:flex;

  justify-content:space-between;

  gap:10px;
}

.search-name{
  font-weight:700;
}

.search-price{
  white-space:nowrap;

  font-weight:700;
}



/* =========================
   よく買う商品
========================= */

.frequent-item{
  padding:13px 0;

  border-bottom:
    1px solid
    #eee;
}

.frequent-item:last-child{
  border-bottom:none;
}

.frequent-top{
  display:flex;

  justify-content:space-between;

  gap:10px;
}

.frequent-name{
  font-weight:700;
}

.frequent-count{
  white-space:nowrap;

  font-weight:700;
}

.product-history{
  display:none;

  margin-top:10px;

  padding:
    10px
    12px;

  background:#f6f6f6;

  border-radius:12px;
}

.product-history.open{
  display:block;
}

.history-row{
  display:flex;

  justify-content:space-between;

  gap:10px;

  padding:6px 0;

  font-size:13px;
}



/* =========================
   設定
========================= */

.setting-item{
  display:flex;

  align-items:center;

  gap:8px;

  padding:11px 0;

  border-bottom:
    1px solid
    #eee;
}

.setting-main{
  flex:1;

  min-width:0;
}

.setting-title{
  font-weight:600;
}

.setting-sub{
  margin-top:3px;

  color:var(--sub);

  font-size:12px;
}

.setting-note{
  margin-top:10px;

  color:var(--sub);

  font-size:12px;
  line-height:1.5;
}



/* =========================
   編集画面
========================= */

.modal-backdrop{
  display:none;

  position:fixed;

  inset:0;

  z-index:2000;

  padding:
    20px
    14px;

  overflow:auto;

  background:
    rgba(
      0,
      0,
      0,
      .45
    );
}

.modal-backdrop.open{
  display:block;
}

.modal{
  width:100%;
  max-width:520px;

  margin:30px auto;

  padding:18px;

  background:#fff;

  border-radius:20px;
}



/* =========================
   下部ナビ
========================= */

.nav{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:1000;

  display:flex;

  gap:3px;

  padding:
    8px
    8px
    calc(
      8px
      +
      env(safe-area-inset-bottom)
    );

  background:
    rgba(
      255,
      255,
      255,
      .97
    );

  border-top:
    1px solid
    #ddd;

  backdrop-filter:
    blur(12px);

  -webkit-backdrop-filter:
    blur(12px);
}

.nav-button{
  flex:1;

  min-width:0;
  min-height:60px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:4px;

  margin:0;

  padding:
    7px
    2px;

  background:transparent;
  color:#777;

  border-radius:13px;
}

.nav-icon{
  font-size:21px;

  line-height:1;
}

.nav-label{
  font-size:12px;
}

.nav-button.active{
  background:#eee;
  color:#111;
}

</style>
</head>


<body>

<div class="app">


<!-- =========================
     ホーム
========================= -->

<section
  id="homePage"
  class="page active"
>

<h1>
  家計簿
</h1>

<div
  id="homeMonthNav"
  class="month-nav"
></div>


<div class="card">

  <div class="total-label">
    この月の支出
  </div>

  <div
    id="homeTotal"
    class="total"
  >
    ¥0
  </div>

</div>


<div class="card">

  <h2>
    予算
  </h2>

  <div
    id="budgetHome"
  ></div>

</div>


<div class="card">

  <h2>
    カテゴリ別
  </h2>

  <div
    id="categorySummary"
  ></div>

</div>


<div class="card">

  <h2>
    円グラフ
  </h2>

  <div
    id="pieArea"
    class="pie-area"
  ></div>

</div>

</section>



<!-- =========================
     カレンダー
========================= -->

<section
  id="calendarPage"
  class="page"
>

<h1>
  カレンダー
</h1>

<div
  id="calendarMonthNav"
  class="month-nav"
></div>


<div class="card">

<div class="calendar">

  <div class="calendar-week">

    <div>日</div>
    <div>月</div>
    <div>火</div>
    <div>水</div>
    <div>木</div>
    <div>金</div>
    <div>土</div>

  </div>


  <div
    id="calendarGrid"
    class="calendar-grid"
  ></div>

</div>


<div
  id="dayDetail"
  class="day-detail"
></div>

</div>

</section>



<!-- =========================
     登録
========================= -->

<section
  id="inputPage"
  class="page"
>

<h1>
  登録
</h1>


<div class="card">

<h2>
  ChatGPTからまとめて入力
</h2>

<div class="hint">
  レシート画像をChatGPTに送り、
  返ってきた内容をそのまま貼り付けてください。
</div>


<textarea
  id="bulkInput"
  placeholder="日付：2026-08-22
店名：スーパー

商品：牛乳
金額：218
カテゴリ：食費

商品：洗剤
金額：398
カテゴリ：日用品"
></textarea>


<button
  class="secondary"
  onclick="previewBulkInput()"
>
  内容を確認する
</button>


<div
  id="bulkPreview"
  class="preview"
>

<h3>
  登録内容
</h3>

<div
  id="bulkPreviewContent"
></div>

<button
  onclick="registerBulkItems()"
>
  この内容を一括登録
</button>

</div>


<div
  id="bulkSuccess"
  class="success"
>
  登録しました。
</div>

</div>



<div class="card">

<h2>
  1商品だけ手入力
</h2>


<div class="field">

<label>
  日付
</label>

<input
  id="manualDate"
  type="date"
>

</div>


<div class="field">

<label>
  店名
</label>

<input
  id="manualShop"
  type="text"
  placeholder="例：スーパー"
>

</div>


<div class="field">

<label>
  商品名
</label>

<input
  id="manualProduct"
  type="text"
  placeholder="例：牛乳"
>

</div>


<div class="field">

<label>
  金額
</label>

<input
  id="manualAmount"
  type="number"
  inputmode="numeric"
  placeholder="例：218"
>

</div>


<div class="field">

<label>
  カテゴリ
</label>

<select
  id="manualCategory"
></select>

</div>


<button
  onclick="registerManualItem()"
>
  登録する
</button>

</div>

</section>



<!-- =========================
     詳細
========================= -->

<section
  id="detailPage"
  class="page"
>

<h1>
  詳細
</h1>


<div class="card">

<h2>
  検索
</h2>

<input
  id="searchInput"
  type="search"
  placeholder="商品名・店名・カテゴリで検索"
  oninput="renderSearchResults()"
>

<div
  id="searchResults"
></div>

</div>



<div class="card">

<h2>
  よく買う商品
</h2>

<div class="subtext">
  同じ商品名で購入回数を集計しています。
</div>

<div
  id="frequentProducts"
></div>

</div>



<h2
  style="margin-top:24px;"
>
  月別明細
</h2>


<div
  id="detailMonthNav"
  class="month-nav"
></div>


<div
  id="receiptList"
></div>

</section>



<!-- =========================
     設定
========================= -->

<section
  id="settingsPage"
  class="page"
>

<h1>
  設定
</h1>


<div class="card">

<h2>
  月の予算
</h2>

<div class="field">

<label>
  毎月の予算
</label>

<input
  id="monthlyBudget"
  type="number"
  inputmode="numeric"
  placeholder="例：150000"
>

</div>


<button
  onclick="saveBudget()"
>
  予算を保存
</button>

<div class="setting-note">
  ホーム画面に残り予算と使用率が表示されます。
</div>

</div>



<div class="card">

<h2>
  カテゴリー
</h2>

<div class="field">

<label>
  新しいカテゴリー
</label>

<input
  id="newCategory"
  type="text"
  placeholder="例：美容"
>

</div>


<button
  onclick="addCategory()"
>
  カテゴリーを追加
</button>


<div
  id="categorySettingsList"
  style="margin-top:16px;"
></div>

</div>



<div class="card">

<h2>
  固定費
</h2>


<div class="field">

<label>
  固定費名
</label>

<input
  id="fixedName"
  type="text"
  placeholder="例：家賃"
>

</div>


<div class="field">

<label>
  金額
</label>

<input
  id="fixedAmount"
  type="number"
  inputmode="numeric"
>

</div>


<div class="field">

<label>
  毎月の日付
</label>

<input
  id="fixedDay"
  type="number"
  inputmode="numeric"
  min="1"
  max="31"
  value="1"
>

</div>


<div class="field">

<label>
  カテゴリー
</label>

<select
  id="fixedCategory"
></select>

</div>


<button
  onclick="addFixedCost()"
>
  固定費を追加
</button>


<div
  id="fixedCostList"
  style="margin-top:16px;"
></div>

</div>

</section>

</div>



<!-- =========================
     編集画面
========================= -->

<div
  id="editModal"
  class="modal-backdrop"
>

<div class="modal">

<h2>
  支出を編集
</h2>


<input
  id="editItemId"
  type="hidden"
>


<div class="field">

<label>
  日付
</label>

<input
  id="editDate"
  type="date"
>

</div>


<div class="field">

<label>
  店名
</label>

<input
  id="editShop"
  type="text"
>

</div>


<div class="field">

<label>
  商品名
</label>

<input
  id="editProduct"
  type="text"
>

</div>


<div class="field">

<label>
  金額
</label>

<input
  id="editAmount"
  type="number"
  inputmode="numeric"
>

</div>

<script>

const ITEMS_KEY =
  "kakeibo_items_v2";

const OLD_ITEMS_KEY =
  "kakeibo_expenses_v1";

const CATEGORY_KEY =
  "kakeibo_categories_v3";

const FIXED_KEY =
  "kakeibo_fixed_costs_v3";

const BUDGET_KEY =
  "kakeibo_budget_v1";


const DEFAULT_CATEGORIES = [
  "食費",
  "お菓子",
  "日用品",
  "外食",
  "交通費",
  "娯楽",
  "固定費",
  "その他"
];


const PIE_COLORS = [
  "#4A90E2",
  "#F5A623",
  "#7ED321",
  "#D0021B",
  "#9013FE",
  "#50E3C2",
  "#B8E986",
  "#4A4A4A",
  "#F8E71C",
  "#417505",
  "#BD10E0",
  "#8B572A"
];


let items = [];

let categories = [];

let fixedCosts = [];

let previewItems = [];

let monthlyBudget = 0;


/* 円グラフの表示モード */

let pieMode =
  "withFixed";


let selectedMonth =
  new Date(
    new Date().getFullYear(),
    new Date().getMonth(),
    1
  );


let selectedCalendarDay =
  null;



/* =========================
   データ読込
========================= */

function loadData(){

  loadItems();

  loadCategories();

  loadFixedCosts();

  loadBudget();

}



function loadItems(){

  const current =
    localStorage.getItem(
      ITEMS_KEY
    );


  if(current){

    try{

      items =
        JSON.parse(
          current
        ) || [];

    }catch{

      items = [];

    }

    return;

  }


  const old =
    localStorage.getItem(
      OLD_ITEMS_KEY
    );


  if(!old){

    items = [];

    return;

  }


  try{

    const oldItems =
      JSON.parse(
        old
      );


    items =
      oldItems.map(
        old => ({

          id:
            "old_" +
            old.id,

          receiptId:
            "old_receipt_" +
            old.id,

          date:
            old.date ||
            "",

          shop:
            old.shop ||
            "旧データ",

          product:
            old.memo ||
            "支出",

          amount:
            Number(
              old.amount
            ) || 0,

          category:
            old.category ||
            "その他",

          createdAt:
            old.id ||
            Date.now()

        })
      );


    saveItems();

  }catch{

    items = [];

  }

}



function loadCategories(){

  const data =
    localStorage.getItem(
      CATEGORY_KEY
    );


  if(data){

    try{

      categories =
        JSON.parse(
          data
        );

    }catch{

      categories =
        [
          ...DEFAULT_CATEGORIES
        ];

    }

  }else{

    categories =
      [
        ...DEFAULT_CATEGORIES
      ];

  }


  items.forEach(
    item => {

      if(
        item.category &&
        !categories.includes(
          item.category
        )
      ){

        categories.push(
          item.category
        );

      }

    }
  );


  saveCategories();

}



function loadFixedCosts(){

  const data =
    localStorage.getItem(
      FIXED_KEY
    );


  if(!data){

    fixedCosts = [];

    return;

  }


  try{

    fixedCosts =
      JSON.parse(
        data
      ) || [];

  }catch{

    fixedCosts = [];

  }

}



function loadBudget(){

  monthlyBudget =
    Number(
      localStorage.getItem(
        BUDGET_KEY
      )
    ) || 0;

}



function saveItems(){

  localStorage.setItem(
    ITEMS_KEY,
    JSON.stringify(
      items
    )
  );

}



function saveCategories(){

  localStorage.setItem(
    CATEGORY_KEY,
    JSON.stringify(
      categories

}



function saveFixedCosts(){

  localStorage.setItem(
    FIXED_KEY,
    JSON.stringify(
      fixedCosts
    )
  );

}



/* =========================
   共通
========================= */

function formatMoney(
  value
){

  return "¥" +
    Number(
      value || 0
    )
    .toLocaleString(
      "ja-JP"
    );

}



function monthKey(
  date
){

  return (
    date.getFullYear()
    +
    "-"
    +
    String(
      date.getMonth() + 1
    )
    .padStart(
      2,
      "0"
    )
  );

}



function selectedMonthKey(){

  return monthKey(
    selectedMonth
  );

}



function formatMonthTitle(
  date
){

  return (
    date.getFullYear()
    +
    "年"
    +
    (
      date.getMonth() + 1
    )
    +
    "月"
  );

}



function formatDateInput(
  date
){

  return [

    date.getFullYear(),

    String(
      date.getMonth() + 1
    )
    .padStart(
      2,
      "0"
    ),

    String(
      date.getDate()
    )
    .padStart(
      2,
      "0"
    )

  ].join(
    "-"
  );

}



function formatDisplayDate(
  date
){

  if(!date){

    return "";

  }


  const parts =
    date.split(
      "-"
    );


  if(
    parts.length !== 3
  ){

    return date;

  }


  return (
    Number(
      parts[1]
    )
    +
    "月"
    +
    Number(
      parts[2]
    )
    +
    "日"
  );

}



function normalizeDate(
  value
){

  if(!value){

    return "";

  }


  value =
    value
    .trim()
    .replace(
      /[年月]/g,
      "/"
    )
    .replace(
      /日/g,
      ""
    )
    .replace(
      /-/g,
      "/"
    );


  const parts =
    value
    .split(
      "/"
    )
    .filter(
      Boolean
    );


  if(
    parts.length === 3
  ){

    return [

      parts[0],

      String(
        parts[1]
      )
      .padStart(
        2,
        "0"
      ),

      String(
        parts[2]
      )
      .padStart(
        2,
        "0"
      )

    ].join(
      "-"
    );

  }


  return "";

}



function daysInMonth(
  year,
  month
){

  return new Date(
    year,
    month + 1,
    0
  )
  .getDate();

}



function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}



function escapeJs(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  )
  .replace(
    /\n/g,
    " "
  );

}



function changeMonth(
  diff
){

  selectedMonth =
    new Date(
      selectedMonth.getFullYear(),
      selectedMonth.getMonth() + diff,
      1
    );


  selectedCalendarDay =
    null;


  renderAll();

}

/* =========================
   固定費
========================= */

function fixedCostActiveInMonth(
  fixed,
  key
){

  if(
    fixed.startMonth &&
    key <
    fixed.startMonth
  ){

    return false;

  }


  if(
    fixed.endMonth &&
    key >
    fixed.endMonth
  ){

    return false;

  }


  return true;

}



function virtualFixedItemsForMonth(
  date
){

  const key =
    monthKey(
      date
    );


  const year =
    date.getFullYear();


  const month =
    date.getMonth();


  const max =
    daysInMonth(
      year,
      month
    );


  return fixedCosts

    .filter(
      fixed =>
        fixedCostActiveInMonth(
          fixed,
          key
        )
    )

    .map(
      fixed => {

        const day =
          Math.min(

            Math.max(
              Number(
                fixed.day
              ) || 1,
              1
            ),

            max

          );


        const dateString =
          year
          +
          "-"
          +
          String(
            month + 1
          )
          .padStart(
            2,
            "0"
          )
          +
          "-"
          +
          String(
            day
          )
          .padStart(
            2,
            "0"
          );


        return {

          id:
            "fixed_"
            +
            fixed.id
            +
            "_"
            +
            key,

          receiptId:
            "fixed_receipt_"
            +
            fixed.id
            +
            "_"
            +
            key,

          date:
            dateString,

          shop:
            "固定費",

          product:
            fixed.name,

          amount:
            Number(
              fixed.amount
            ),

          category:
            fixed.category,

          createdAt:
            0,

          isFixed:
            true,

          fixedId:
            fixed.id

        };

      }
    );

}



function monthItems(){

  const key =
    selectedMonthKey();


  const normal =
    items.filter(
      item =>
        item.date &&
        item.date.slice(
          0,
          7
        ) === key
    );


  return [

    ...normal,

    ...virtualFixedItemsForMonth(
      selectedMonth
    )

  ];

}



/* =========================
   予算
========================= */

function saveBudget(){

  const value =
    Number(
      document
      .getElementById(
        "monthlyBudget"
      )
      .value
    );


  if(
    value < 0
  ){

    alert(
      "0円以上で入力してください。"
    );

    return;

  }


  monthlyBudget =
    value;


  localStorage.setItem(
    BUDGET_KEY,
    String(
      monthlyBudget
    )
  );


  renderHome();


  alert(
    "予算を保存しました。"
  );

}



function renderBudget(){

  const area =
    document
    .getElementById(
      "budgetHome"
    );


  const spending =
    monthItems()
    .reduce(
      (
        sum,
        item
      ) =>
        sum +
        Number(
          item.amount
        ),
      0
    );


  if(
    !monthlyBudget
  ){

    area.innerHTML = `

      <div class="empty">

        予算が設定されていません。
        <br>
        設定画面から登録できます。

      </div>

    `;

    return;

  }


  const remaining =
    monthlyBudget -
    spending;


  const percent =
    Math.round(
      spending /
      monthlyBudget *
      100
    );


  const width =
    Math.min(
      percent,
      100
    );


  area.innerHTML = `

    <div
      class="${
        remaining < 0
        ? "budget-over"
        : ""
      }"
    >

      <div class="budget-top">

        <div>

          <div class="subtext">

            ${
              remaining >= 0
              ? "あと使える金額"
              : "予算オーバー"
            }

          </div>

          <div class="budget-main">

            ${
              formatMoney(
                Math.abs(
                  remaining
                )
              )
            }

          </div>

        </div>


        <div class="subtext">

          ${percent}%使用

        </div>

      </div>


      <div class="budget-progress">

        <div
          class="budget-progress-bar"
          style="
            width:${width}%;
          "
        ></div>

      </div>


      <div
        class="subtext"
        style="
          margin-top:9px;
        "
      >

        ${
          formatMoney(
            spending
          )
        }

        ／

        ${
          formatMoney(
            monthlyBudget
          )
        }

      </div>

    </div>

  `;

}



/* =========================
   ChatGPT一括入力
========================= */

function parseBulkText(
  text
){

  const lines =
    text
    .split(
      /\r?\n/
    )
    .map(
      line =>
        line.trim()
    );


  let date = "";

  let shop = "";

  let product = "";

  let amount = "";

  let category = "";


  const result = [];


  function push(){

    if(
      !product ||
      !amount
    ){

      return;

    }


    const number =
      Number(

        String(
          amount
        )

        .replace(
          /[¥￥円,\s]/g,
          ""
        )

        .replace(
          /[^\d]/g,
          ""
        )

      );


    if(
      !number
    ){

      return;

    }


    result.push({

      date,

      shop,

      product,

      amount:
        number,

      category:
        category ||
        "その他"

    });


    product = "";

    amount = "";

    category = "";

  }


  lines.forEach(
    line => {

      let match;


      match =
        line.match(
          /^日付\s*[：:]\s*(.+)$/
        );


      if(match){

        date =
          normalizeDate(
            match[1]
          );

        return;

      }


      match =
        line.match(
          /^店名\s*[：:]\s*(.+)$/
        );


      if(match){

        shop =
          match[1]
          .trim();

        return;

      }


      match =
        line.match(
          /^商品\s*[：:]\s*(.+)$/
        );


      if(match){

        push();

        product =
          match[1]
          .trim();

        return;

      }


      match =
        line.match(
          /^金額\s*[：:]\s*(.+)$/
        );


      if(match){

        amount =
          match[1]
          .trim();

        return;

      }


      match =
        line.match(
          /^カテゴリ\s*[：:]\s*(.+)$/
        );


      if(match){

        category =
          match[1]
          .trim();

      }

    }
  );


  push();


  return result;

}



function previewBulkInput(){

  previewItems =
    parseBulkText(

      document
      .getElementById(
        "bulkInput"
      )
      .value

    );


  if(
    !previewItems.length
  ){

    alert(
      "商品データを読み取れませんでした。"
    );

    return;

  }


  if(
    !previewItems[0].date
  ){

    alert(
      "日付を読み取れませんでした。"
    );

    return;

  }


  const total =
    previewItems
    .reduce(
      (
        sum,
        item
      ) =>
        sum +
        Number(
          item.amount
        ),
      0
    );


  let html = `

    <div
      style="
        margin-bottom:10px;
      "
    >

      <strong>

        ${
          formatDisplayDate(
            previewItems[0].date
          )
        }

        ・

        ${
          escapeHtml(
            previewItems[0].shop ||
            "店名なし"
          )
        }

      </strong>

      <div class="subtext">

        ${
          previewItems.length
        }商品

        ／

        ${
          formatMoney(
            total
          )
        }

      </div>

    </div>

  `;


  previewItems.forEach(
    item => {

      const isNew =
        !categories.includes(
          item.category
        );


      html += `

        <div class="preview-item">

          <div class="preview-item-left">

            ${
              escapeHtml(
                item.product
              )
            }

            <span
              class="
                badge
                ${
                  isNew
                  ? "new-badge"
                  : ""
                }
              "
            >

              ${
                escapeHtml(
                  item.category
                )
              }

            </span>

          </div>


          <strong>

            ${
              formatMoney(
                item.amount
              )
            }

          </strong>

        </div>

      `;

    }
  );


  document
    .getElementById(
      "bulkPreviewContent"
    )
    .innerHTML =
    html;


  document
    .getElementById(
      "bulkPreview"
    )
    .style.display =
    "block";

}



function createReceiptId(){

  return (
    "r_"
    +
    Date.now()
    +
    "_"
    +
    Math.random()
    .toString(
      36
    )
    .slice(
      2,
      8
    )
  );

}



function registerBulkItems(){

  if(
    !previewItems.length
  ){

    return;

  }


  previewItems.forEach(
    item => {

      if(
        !categories.includes(
          item.category
        )
      ){

        categories.push(
          item.category
        );

      }

    }
  );


  saveCategories();


  const receiptId =
    createReceiptId();


  const now =
    Date.now();


  previewItems.forEach(
    (
      item,
      index
    ) => {

      items.push({

        id:
          receiptId
          +
          "_"
          +
          index,

        receiptId,

        date:
          item.date,

        shop:
          item.shop,

        product:
          item.product,

        amount:
          Number(
            item.amount
          ),

        category:
          item.category,

        createdAt:
          now +
          index

      });

    }
  );


  saveItems();


  previewItems = [];


  document
    .getElementById(
      "bulkInput"
    )
    .value =
    "";


  document
    .getElementById(
      "bulkPreview"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "bulkSuccess"
    )
    .style.display =
    "block";


  setupCategorySelects();

  renderAll();

}

    .getElementById(

    .value =

  renderAll();


  alert(

  );

function openEditModal(
  id
){

  const item =
    items.find(
      item =>
        item.id === id
    );


  if(
    !item
  ){

    return;

  }


  document
    .getElementById(
      "editItemId"
    )
    .value =
    item.id;


  document
    .getElementById(
      "editDate"
    )
    .value =
    item.date;


  document
    .getElementById(
      "editShop"
    )
    .value =
    item.shop ||
    "";


  document
    .getElementById(
      "editProduct"
    )
    .value =
    item.product ||
    "";


  document
    .getElementById(
      "editAmount"
    )
    .value =
    item.amount;


  setupCategorySelect(
    document
    .getElementById(
      "editCategory"
    ),
    item.category
  );


  document
    .getElementById(
      "editModal"
    )
    .classList
    .add(
      "open"
    );

}



function closeEditModal(){

  document
    .getElementById(
      "editModal"
    )
    .classList
    .remove(
      "open"
    );

}



function saveEditedItem(){

  const id =
    document
    .getElementById(
      "editItemId"
    )
    .value;


  const item =
    items.find(
      item =>
        item.id === id
    );


  if(
    !item
  ){

    return;

  }


  const date =
    document
    .getElementById(
      "editDate"
    )
    .value;


  const product =
    document
    .getElementById(
      "editProduct"
    )
    .value
    .trim();


  const amount =
    Number(
      document
      .getElementById(
        "editAmount"
      )
      .value
    );


  if(
    !date ||
    !product ||
    !amount ||
    amount <= 0

========================= */

function renderFrequentProducts(){

  const area =
    document
    .getElementById(
      "frequentProducts"
    );


  if(
    !area
  ){

    return;

  }


  const map = {};


  items.forEach(
    item => {

      const name =
        (
          item.product ||
          ""
        )
        .trim();


      if(
        !name
      ){

        return;

      }


      if(
        !map[
          name
        ]
      ){

        map[
          name
        ] = [];

      }


      map[
        name
      ]
      .push(
        item
      );

    }
  );


  const list =
    Object.entries(
      map
    )

    .map(
      (
        [
          name,
          purchases
        ]
      ) => ({

        name,

        purchases,

        count:
          purchases.length,

        latest:
          [
            ...purchases
          ]
          .sort(
            (
              a,
              b
            ) =>
              b.date.localeCompare(
                a.date
              )
          )[0]

      })
    )

    .sort(
      (
        a,
        b
      ) => {

        if(
          b.count !==
          a.count
        ){

          return (
            b.count -
            a.count
          );

        }


        return (
          b.latest.date
          .localeCompare(
            a.latest.date
          )
        );

      }
    )

    .slice(
      0,
      10
    );


  if(
    !list.length
  ){

    area.innerHTML =
      '<div class="empty">まだ購入履歴がありません</div>';

    return;

  }


  area.innerHTML =
    list.map(
      (
        entry,
        index
      ) => {

        const history =
          [
            ...entry.purchases
          ]

          .sort(
            (
              a,
              b
            ) =>
              b.date.localeCompare(
                a.date
              )
          )

          .slice(
            0,
            20
          )

          .map(
            item => `

              <div class="history-row">

                <div>

                  ${
                    escapeHtml(
                      item.date
                    )
                  }

                  ・

                  ${
                    escapeHtml(
                      item.shop ||
                      ""
                    )
                  }

                </div>

                <strong>

                  ${
                    formatMoney(
                      item.amount
                    )
                  }

                </strong>

              </div>

            `
          )

          .join(
            ""
          );


        return `

          <div class="frequent-item">

            <div
              onclick="
                toggleProductHistory(
                  'history_${index}'
                )
              "
            >

              <div class="frequent-top">

                <div>

                  <div class="frequent-name">

                    ${
                      escapeHtml(
                        entry.name
                      )
                    }

                  </div>

                  <div class="subtext">

                    最新

                    ${
                      formatMoney(
                        entry.latest.amount
                      )
                    }

                    ・

                    ${
                      escapeHtml(
                        entry.latest.date
                      )
                    }

                  </div>

                </div>


                <div class="frequent-count">

                  ${entry.count}回

                </div>

              </div>


              <div
                class="subtext"
                style="
                  margin-top:5px;
                "
              >

                タップして購入履歴

              </div>

            </div>


            <div
              id="history_${index}"
              class="product-history"
            >

              ${history}

            </div>

          </div>

        `;

      }
    )

    .join(
      ""
    );

}

function setupCategorySelect(
  select,
  currentValue
){

  if(
    !select
  ){

    return;

  }


  const previous =
    currentValue ||
    select.value;


  select.innerHTML =
    "";


  categories.forEach(
    category => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        category;


      option.textContent =
        category;


      select.appendChild(
        option
      );

    }
  );


  if(
    categories.includes(
      previous
    )
  ){

    select.value =
      previous;

  }

}

  setupCategorySelect(

      )

    );

    )

  if(

  ){

  }


  if(
    !amount ||
    amount <= 0
  ){

  }


  if(
    day < 1 ||
    day > 31
  ){

    );

    return;

  }


  fixedCosts.push({

    id:
      "f_"
      +
      Date.now()
      +
      "_"
      +
      Math.random()
      .toString(
        36
      )
      .slice(
        2,
        7
      ),

    name,

    amount,

    day,

    category,

    startMonth:
      monthKey(
        new Date()
      ),

    endMonth:
      null

  });


  saveFixedCosts();


  document
    .getElementById(
      "fixedName"
    )
    .value =
    "";


  document
    .getElementById(
      "fixedAmount"
    )
    .value =
    "";


  document
    .getElementById(
      "fixedDay"
    )
    .value =
    "1";


  renderAll();

}



function previousMonthKey(
  key
){

  const parts =
    key
    .split(
      "-"
    )
    .map(
      Number
    );


  const date =
    new Date(
      parts[0],
      parts[1] - 2,
      1
    );


  return monthKey(
    date
  );

}



function deleteFixedCost(
  id
){

  const fixed =
    fixedCosts.find(
      item =>
        item.id === id
    );


  if(
    !fixed
  ){

    return;

  }


  if(
    !confirm(
      "「"
      +
      fixed.name
      +
      "」を今月以降の固定費から削除しますか？"
    )
  ){

    return;

  }


  const currentKey =
    monthKey(
      new Date()
    );


  if(
    fixed.startMonth ===
    currentKey
  ){

    fixedCosts =
      fixedCosts.filter(
        item =>
          item.id !== id
      );

  }else{

    fixed.endMonth =
      previousMonthKey(
        currentKey
      );

  }


  saveFixedCosts();


  renderAll();

}

========================= */

function setPieMode(
  mode
){

  pieMode =
    mode;


  renderPie();

}



function renderPie(){

  const area =
    document
    .getElementById(
      "pieArea"
    );


  let data =
    monthItems();


  /*
    固定費を除くモードでは
    設定画面から自動生成された
    isFixed:true の支出だけを除外
  */

  if(
    pieMode ===
    "withoutFixed"
  ){

    data =
      data.filter(
        item =>
          !item.isFixed
      );

  }


  const totals = {};


  data.forEach(
    item => {

      const category =
        item.category ||
        "その他";


      totals[
        category
      ] =
        (
          totals[
            category
          ] || 0
        )
        +
        Number(
          item.amount
        );

    }
  );


  const entries =
    Object.entries(
      totals
    )

    .filter(
      item =>
        item[1] > 0
    )

    .sort(
      (
        a,
        b
      ) =>
        b[1] -
        a[1]
    );


  const total =
    entries.reduce(
      (
        sum,
        entry
      ) =>
        sum +
        Number(
          entry[1]
        ),
      0
    );


  const toggleHtml = `

    <div class="pie-toggle">

      <button
        class="${
          pieMode ===
          "withFixed"
          ? "active"
          : ""
        }"
        onclick="
          setPieMode(
            'withFixed'
          )
        "
      >

        固定費込み

      </button>


      <button
        class="${
          pieMode ===
          "withoutFixed"
          ? "active"
          : ""
        }"
        onclick="
          setPieMode(
            'withoutFixed'
          )
        "
      >

        固定費を除く

      </button>

    </div>

  `;


  if(
    !total
  ){

    area.innerHTML =
      toggleHtml
      +
      '<div class="empty">表示できる支出がありません</div>';


    return;

  }


  let degree = 0;


  const gradients =
    entries.map(
      (
        [
          category,
          amount
        ],
        index
      ) => {

        const start =
          degree;


        degree +=
          amount /
          total *
          360;


        return (
          PIE_COLORS[
            index %
            PIE_COLORS.length
          ]
          +
          " "
          +
          start
          +
          "deg "
          +
          degree
          +
          "deg"
        );

      }
    );


  const legend =
    entries.map(
      (
        [
          category,
          amount
        ],
        index
      ) => {

        const percent =
          Math.round(
            amount /
            total *
            100
          );


        return `

          <div class="legend-row">

            <div class="legend-left">

              <span
                class="legend-dot"
                style="
                  background:
                  ${
                    PIE_COLORS[
                      index %
                      PIE_COLORS.length
                    ]
                  };
                "
              ></span>


              <span>

                ${
                  escapeHtml(
                    category
                  )
                }

              </span>

            </div>


            <div class="legend-value">

              ${
                formatMoney(
                  amount
                )
              }

              ・

              ${percent}%

            </div>

          </div>

        `;

      }
    )
    .join(
      ""
    );


  area.innerHTML = `

    ${toggleHtml}


    <div
      class="pie-chart"
      style="
        background:
          conic-gradient(
            ${
              gradients.join(
                ","
              )
            }
          );
      "
    >

      <div class="pie-hole">

        ${
          formatMoney(
            total
          )
        }

      </div>

    </div>


    <div class="pie-legend">

      ${legend}

    </div>

  `;

}

  grid.innerHTML =
    "";

    new Date(

    )

  const max =
    daysInMonth(

      month
    );

  monthItems()
  .forEach(
    item => {

        Number(
          item.date

        day
      ] =
        (
          totals[
            day
          ] || 0
        )
        +

  );


  for(
    let i = 0;
    i < firstDay;
    i++

    grid.innerHTML +=
      '<div class="calendar-day empty-day"></div>';

  }


  for(
    let day = 1;
    day <= max;
    day++

    const total =
      totals[
        day

    grid.innerHTML += `

      <div
        class="

function renderDetails(){

  renderMonthNavigator(
    "detailMonthNav"
  );


  const data =
    monthItems();


  const map =
    new Map();


  data.forEach(
    item => {

      if(
        !map.has(
          item.receiptId
        )
      ){

        map.set(
          item.receiptId,
          []
        );

      }


      map
      .get(
        item.receiptId
      )
      .push(
        item
      );

    }
  );


  const receipts =
    Array.from(
      map.entries()
    )

    .map(
      (
        [
          receiptId,
          list
        ]
      ) => ({

        receiptId,

        items:
          list,

        date:
          list[0].date,

        shop:
          list[0].shop,

        total:
          list.reduce(
            (
              sum,
              item
            ) =>
              sum +
              Number(
                item.amount
              ),
            0
          ),

        isFixed:
          list.every(
            item =>
              item.isFixed
          )

      })
    )

    .sort(
      (
        a,
        b
      ) =>
        b.date.localeCompare(
          a.date
        )
    );


  const area =
    document
    .getElementById(
      "receiptList"
    );


  if(
    !receipts.length
  ){

    area.innerHTML =
      '<div class="card empty">この月の支出はありません</div>';

    return;

  }


  area.innerHTML =
    receipts.map(
      (
        receipt,
        index
      ) => {

        const groups = {};


        receipt.items.forEach(
          item => {

            const category =
              item.category ||
              "その他";


            if(
              !groups[
                category
              ]
            ){

              groups[
                category
              ] = [];

            }


            groups[
              category
            ]
            .push(
              item
            );

          }
        );


        let body = "";


        Object.entries(
          groups
        )
        .forEach(
          (
            [
              category,
              list
            ]
          ) => {

            body += `

              <div class="detail-category-title">

                ${
                  escapeHtml(
                    category
                  )
                }

              </div>

            `;


            list.forEach(
              item => {

                body += `

                  <div class="detail-item">

                    <div class="detail-item-name">

                      ${
                        escapeHtml(
                          item.product
                        )
                      }


                      ${
                        item.isFixed
                        ? '<span class="fixed-tag">固定費</span>'
                        : ""
                      }

                    </div>


                    <div class="detail-item-price">

                      ${
                        formatMoney(
                          item.amount
                        )
                      }

                    </div>


                    ${
                      !item.isFixed
                      ? `

                          <button
                            class="secondary small"
                            onclick="
                              openEditModal(
                                '${item.id}'
                              )
                            "
                          >

                            編集

                          </button>


                          <button
                            class="danger small"
                            onclick="
                              deleteItem(
                                '${item.id}'
                              )
                            "
                          >

                            削除

                          </button>

                        `
                      : ""
                    }

                  </div>

                `;

              }
            );

          }
        );


        return `

          <div class="receipt-card">

            <div
              class="receipt-header"
              onclick="
                toggleReceipt(
                  'receiptBody${index}'
                )
              "
            >

              <div class="receipt-top">

                <div>

                  <div class="receipt-date">

                    ${
                      formatDisplayDate(
                        receipt.date
                      )
                    }

                  </div>


                  <div class="receipt-shop">

                    ${
                      escapeHtml(
                        receipt.shop ||
                        "店名なし"
                      )
                    }

                  </div>

                </div>


                <div class="receipt-total">

                  ${
                    formatMoney(
                      receipt.total
                    )
                  }

                </div>

              </div>


              <div class="receipt-count">

                ${
                  receipt.items.length
                }商品

                ・

                タップして詳細

              </div>

            </div>


            <div
              id="receiptBody${index}"
              class="receipt-body"
            >

              ${body}

            </div>

          </div>

        `;

      }
    )
    .join(
      ""
    );

}



function toggleReceipt(
  id
){

  document
    .getElementById(
      id
    )
    ?.classList
    .toggle(
      "open"
    );

}



function deleteItem(
  id
){

  if(
    !confirm(
      "この商品を削除しますか？"
    )
  ){

    return;

  }


  items =
    items.filter(
      item =>
        item.id !== id
    );


  saveItems();


  renderAll();

}



/* =========================
   設定
========================= */

function renderSettings(){

  document
    .getElementById(
      "monthlyBudget"
    )
    .value =
    monthlyBudget ||
    "";


  document
    .getElementById(
      "categorySettingsList"
    )
    .innerHTML =
    categories.map(
      category => `

        <div class="setting-item">

          <div class="setting-main">

            <div class="setting-title">

              ${
                escapeHtml(
                  category
                )
              }

            </div>

          </div>


          <button
            class="danger small"
            onclick="
              deleteCategory(
                '${escapeJs(category)}'
              )
            "
          >

            削除

          </button>

        </div>

      `
    )
    .join(
      ""
    );


  const active =
    fixedCosts.filter(
      fixed =>
        !fixed.endMonth
    );


  document
    .getElementById(
      "fixedCostList"
    )
    .innerHTML =
    active.length

    ? active.map(
        fixed => `

          <div class="setting-item">

            <div class="setting-main">

              <div class="setting-title">

                ${
                  escapeHtml(
                    fixed.name
                  )
                }

                ・

                ${
                  formatMoney(
                    fixed.amount
                  )
                }

              </div>


              <div class="setting-sub">

                毎月
                ${fixed.day}日

                ／

                ${
                  escapeHtml(
                    fixed.category
                  )
                }

              </div>

            </div>


            <button
              class="danger small"
              onclick="
                deleteFixedCost(
                  '${fixed.id}'
                )
              "
            >

              削除

            </button>

          </div>

        `
      )
      .join(
        ""
      )

    : '<div class="empty">固定費はまだありません</div>';

}



/* =========================
   ページ切替
========================= */

function showPage(
  page
){

  document
    .querySelectorAll(
      ".page"
    )
    .forEach(
      element =>
        element
        .classList
        .remove(
          "active"
        )
    );


  document
    .querySelectorAll(
      ".nav-button"
    )
    .forEach(
      element =>
        element
        .classList
        .remove(
          "active"
        )
    );


  const map = {

    home:[
      "homePage",
      "navHome"
    ],

    calendar:[
      "calendarPage",
      "navCalendar"
    ],

    input:[
      "inputPage",
      "navInput"
    ],

    detail:[
      "detailPage",
      "navDetail"
    ],

    settings:[
      "settingsPage",
      "navSettings"
    ]

  };


  const target =
    map[
      page
    ];


  document
    .getElementById(
      target[0]
    )
    .classList
    .add(
      "active"
    );


  document
    .getElementById(
      target[1]
    )
    .classList
    .add(
      "active"
    );


  if(
    page ===
    "detail"
  ){

    renderSearchResults();

    renderFrequentProducts();

    renderDetails();

  }


  if(
    page ===
    "calendar"
  ){

    renderCalendar();

  }


  if(
    page ===
    "settings"
  ){

    renderSettings();

  }


  window.scrollTo(
    0,
    0
  );

}



/* =========================
   全体描画
========================= */

function renderAll(){

  renderHome();

  renderCalendar();

  renderDetails();

  renderFrequentProducts();

  renderSearchResults();

  renderSettings();

  setupCategorySelects();

}



/* =========================
   初期化
========================= */

loadData();


setupCategorySelects();


document
  .getElementById(
    "manualDate"
  )
  .value =
  formatDateInput(
    new Date()
  );


renderAll();

</script>
